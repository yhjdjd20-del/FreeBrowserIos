name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build iOS App
        run: |
          xcodebuild clean build \
            -project FreeBrowserIos.xcodeproj \
            -scheme FreeBrowserIos \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENTITLEMENTS_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R ./build/Build/Products/Release-iphoneos/FreeBrowserIos.app Payload/
          zip -q -r FreeBrowserIos-Unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeBrowserIos-Unsigned-IPA
          path: FreeBrowserIos-Unsigned.ipa
name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and build with iosbox
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            mobaiapp/iosbox:latest \
            iosbox dev /project

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BrowserX-Unsigned-IPA
          path: /project/build/iosbox/BrowserX.ipa
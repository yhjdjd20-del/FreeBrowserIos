name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build iOS App
        run: |
          xcodebuild \
            -project BrowserX.xcodeproj \
            -scheme BrowserX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R ~/Library/Developer/Xcode/DerivedData/BrowserX-*/Build/Products/Release-iphoneos/BrowserX.app Payload/
          zip -q -r BrowserX-Unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrowserX-Unsigned-IPA
          path: BrowserX-Unsigned.ipa
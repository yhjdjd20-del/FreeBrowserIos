name: BrowserX

options:
  bundleIdPrefix: com.browserx
  deploymentTarget:
    iOS: "17.0"

targets:
  BrowserX:
    type: application
    platform: iOS
    sources:
      - path: BrowserX # XcodeGen автоматически подтянет все папки (App, Models, Views и т.д.)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES # Автоматически сгенерирует Info.plist для сборки
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0